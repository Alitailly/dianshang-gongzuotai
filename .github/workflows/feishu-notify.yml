name: feishu-notify

on:
  push:
    branches: [ main ]

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
      COMMIT_MSG: ${{ github.event.head_commit.message }}
      COMMIT_URL: ${{ github.event.head_commit.url }}
    steps:
      - name: Send Feishu message
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          # 清理提交说明中的控制字符（防伪造通知格式），截断 120 字符
          msg = re.sub(r"[\x00-\x1f\x7f]+", " ", os.environ.get("COMMIT_MSG", "")).strip()[:120]
          text = (
              "📦 代码更新通知\n"
              f"仓库：{os.environ['GITHUB_REPOSITORY']}\n"
              f"分支：{os.environ['GITHUB_REF_NAME']}\n"
              f"提交人：{os.environ['GITHUB_ACTOR']}\n"
              f"提交说明：{msg}\n"
              f"链接：{os.environ.get('COMMIT_URL','')}"
          )
          body = json.dumps({"msg_type": "text", "content": {"text": text}}).encode()
          req = urllib.request.Request(os.environ["FEISHU_WEBHOOK"], data=body, headers={"Content-Type": "application/json"})
          with urllib.request.urlopen(req, timeout=15) as resp:
              status = resp.status
          print(f"feishu notify status: {status}")
          PY
